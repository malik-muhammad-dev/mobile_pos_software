name: CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Check file line limits
        shell: bash
        run: ./scripts/check_line_limits.sh

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test