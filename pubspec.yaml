name: mobile_shop_pos
description: Offline desktop POS for mobile phone shops (iPhone-focused inventory, Android/Khata ledger, white-label).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  crypto: ^3.0.3
  intl: ^0.19.0
  supabase_flutter: ^2.8.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  # Plus Jakarta Sans matches the approved Stitch design system. Drop the actual
  # .ttf files into assets/fonts/ (weights: Regular 500, Bold 700, ExtraBold 800) —
  # kept as local asset files, not the google_fonts package, because that package
  # fetches over the network at runtime and this app must stay fully offline.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800